setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1


set -g status-position top

set -g mouse on
bind-key -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind-key -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }
bind-key -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }

set -s escape-time 0

set-option -g destroy-unattached on
set-option -g renumber-windows on

bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded" 
bind -n M-Enter new-window
bind -n M-w kill-window

bind -n M-0 select-window -t 10
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @tmux-dracula 'dark'
run-shell '~/.config/tmux/plugins/dracula/dracula.tmux'

set -g status 2
set -g status-style "bg=default"
set -g status-format[0] "#[fill=#2a2c39]#{T;=/#{status-left-length}:status-left}#[align=left]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange],#[range=window|#{window_index}]#{T:window-status-current-format}#[norange]}#[align=right]#{T;=/#{status-right-length}:status-right}"
set -g status-format[1] ""

set -g mode-style "fg=#c5c8c6,bg=#203237"
